<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <defs>
    <marker id="fig03-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B4552D"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="360" fill="#FFFFFF"/>
  <rect x="10" y="10" width="660" height="340" fill="#FFFDF9" stroke="#D8D3C8" stroke-width="1"/>

  <text x="28" y="36" font-size="15" font-weight="700" fill="#1B3A5C">图 V-03　AI 代码的隐性缺陷</text>
  <text x="652" y="36" font-size="12" fill="#8A8578" text-anchor="end">剖面图解 · 水面 / 水下两层</text>
  <line x1="10" y1="52" x2="670" y2="52" stroke="#D8D3C8" stroke-width="1"/>

  <!-- 水体 -->
  <rect x="30" y="70" width="620" height="222" fill="#E7EFF4" stroke="#C6D8E2" stroke-width="1"/>

  <!-- 水面之上：可观察 -->
  <text x="70" y="104" font-size="17" font-weight="700" fill="#1B3A5C">水面以上 · 看得见</text>
  <text x="70" y="130" font-size="12" fill="#5C6B77">接口返回 200 · 界面渲染正常 · 演示流程走通</text>
  <text x="596" y="104" font-size="12" font-weight="700" fill="#1B3A5C" text-anchor="end">能跑</text>

  <!-- 水面波浪 -->
  <path d="M30,196 q15.6,-9 31.2,0 t31.2,0 t31.2,0 t31.2,0 t31.2,0 t31.2,0 t31.2,0 t31.2,0 t31.2,0 t31.2,0 t31.2,0 t31.2,0 t31.2,0 t31.2,0 t31.2,0 t31.2,0 t31.2,0 t31.2,0 t31.2,0 t31.2,0"
        fill="none" stroke="#B4552D" stroke-width="2.4"/>
  <line x1="30" y1="196" x2="648" y2="196" stroke="#B4552D" stroke-width="2.4" stroke-dasharray="3 9"/>

  <!-- 水面之下 -->
  <text x="70" y="226" font-size="12" font-weight="700" fill="#8A6A4A">水面以下 · 看不见</text>
  <rect x="44" y="238" width="144" height="42" rx="4" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1"/>
  <text x="116" y="256" font-size="12" font-weight="700" fill="#33322E" text-anchor="middle">边界条件缺失</text>
  <text x="116" y="271" font-size="10" fill="#8A8578" text-anchor="middle">空值 / 极值 / 异常输入</text>
  <rect x="200" y="238" width="144" height="42" rx="4" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1"/>
  <text x="272" y="256" font-size="12" font-weight="700" fill="#33322E" text-anchor="middle">资源失控</text>
  <text x="272" y="271" font-size="10" fill="#8A8578" text-anchor="middle">句柄 / 连接未释放</text>
  <rect x="356" y="238" width="144" height="42" rx="4" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1"/>
  <text x="428" y="256" font-size="12" font-weight="700" fill="#33322E" text-anchor="middle">并发漏洞</text>
  <text x="428" y="271" font-size="10" fill="#8A8578" text-anchor="middle">竞态 / 数据错乱</text>
  <rect x="512" y="238" width="144" height="42" rx="4" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1"/>
  <text x="584" y="256" font-size="12" font-weight="700" fill="#33322E" text-anchor="middle">安全隐患</text>
  <text x="584" y="271" font-size="10" fill="#8A8578" text-anchor="middle">越权 / 注入 / 泄漏</text>

  <!-- 下沉箭头 -->
  <line x1="648" y1="150" x2="648" y2="196" stroke="#B4552D" stroke-width="1.6" marker-end="url(#fig03-ar)"/>
  <text x="644" y="146" font-size="11" font-weight="700" fill="#B4552D" text-anchor="end">缺陷向下沉</text>

  <line x1="10" y1="326" x2="670" y2="326" stroke="#E4E0D8" stroke-width="1"/>
  <text x="28" y="344" font-size="11" fill="#8A8578">注：看得见的是「能跑」，看不见的是「不会崩」。</text>
  <rect x="452" y="330" width="218" height="26" fill="#FAF7F2" stroke="#D8D3C8" stroke-width="1"/>
  <text x="561" y="347" font-size="11" fill="#8A8578" text-anchor="middle">V-03 · 剖面图解（示意） · 2026-10</text>
</svg>
