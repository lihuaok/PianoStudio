<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <defs>
    <marker id="fig02-arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8578"/>
    </marker>
    <marker id="fig02-arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B4552D"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="360" fill="#FFFFFF"/>
  <rect x="10" y="10" width="660" height="340" fill="#FFFDF9" stroke="#D8D3C8" stroke-width="1"/>

  <text x="28" y="36" font-size="15" font-weight="700" fill="#1B3A5C">图 V-02　认知上限定律</text>
  <text x="652" y="36" font-size="12" fill="#8A8578" text-anchor="end">曲线图解 · 横轴认知深度 / 纵轴代码质量</text>
  <line x1="10" y1="52" x2="670" y2="52" stroke="#D8D3C8" stroke-width="1"/>

  <!-- 绘图区 -->
  <rect x="98" y="70" width="530" height="232" fill="#FCFBF7" stroke="#E4E0D8" stroke-width="1"/>
  <g stroke="#E4E0D8" stroke-width="1">
    <line x1="98" y1="128" x2="628" y2="128"/>
    <line x1="98" y1="186" x2="628" y2="186"/>
    <line x1="98" y1="244" x2="628" y2="244"/>
  </g>

  <!-- 实际产出面（min 曲线以下） -->
  <path d="M98,278 L363,179 L508,125 L628,102 L628,302 L98,302 Z" fill="#EAF0F5" opacity="0.9"/>
  <!-- 认知赤字带（模型能力线 与 实际产出线 之间） -->
  <path d="M98,203 L363,153 L508,125 L508,125 L363,179 L98,278 Z" fill="#FBEFE6" stroke="#E0C9A6" stroke-width="1"/>

  <!-- 坐标轴 -->
  <line x1="98" y1="302" x2="628" y2="302" stroke="#5C6B77" stroke-width="1.4" marker-end="url(#fig02-arD)"/>
  <line x1="98" y1="70" x2="98" y2="302" stroke="#5C6B77" stroke-width="1.4"/>
  <g font-size="11" fill="#8A8578" text-anchor="end">
    <text x="88" y="75">100</text>
    <text x="88" y="132">75</text>
    <text x="88" y="190">50</text>
    <text x="88" y="248">25</text>
    <text x="88" y="306">0</text>
  </g>
  <text x="28" y="186" font-size="11" fill="#5C6B77" transform="rotate(-90 28 186)" text-anchor="middle">代码质量</text>
  <g font-size="11" fill="#8A8578" text-anchor="middle">
    <text x="150" y="320">浅</text>
    <text x="280" y="320">一般</text>
    <text x="400" y="320">足够</text>
    <text x="540" y="320">深厚</text>
  </g>
  <text x="363" y="338" font-size="11" fill="#5C6B77" text-anchor="middle">使用者工程认知深度 →</text>

  <!-- 三条关键线 -->
  <path d="M98,203 L363,153 L508,125 L628,102" fill="none" stroke="#9DB8CE" stroke-width="2" stroke-dasharray="8 5"/>
  <path d="M98,278 L363,179 L508,125 L628,80" fill="none" stroke="#8A8578" stroke-width="2"/>
  <path d="M98,278 L363,179 L508,125 L628,102" fill="none" stroke="#1B3A5C" stroke-width="2.8"/>

  <!-- 交点 -->
  <circle cx="508" cy="125" r="5.5" fill="#FFFFFF" stroke="#B4552D" stroke-width="2.6"/>
  <line x1="504" y1="121" x2="466" y2="94" stroke="#B4552D" stroke-width="1.2"/>
  <text x="462" y="88" font-size="12" font-weight="700" fill="#B4552D" text-anchor="end">临界点：认知补齐</text>
  <text x="462" y="104" font-size="11" fill="#B4552D" text-anchor="end">产出随认知跃迁</text>

  <!-- 线标注 -->
  <line x1="176" y1="106" x2="212" y2="132" stroke="#9DB8CE" stroke-width="1.2"/>
  <text x="172" y="102" font-size="11" fill="#7C94AC" text-anchor="end">模型能力上限</text>
  <line x1="556" y1="90" x2="592" y2="100" stroke="#8A8578" stroke-width="1.2"/>
  <text x="560" y="94" font-size="11" fill="#8A8578">使用者认知天花板</text>
  <text x="363" y="292" font-size="11" font-weight="700" fill="#1B3A5C" text-anchor="middle">实际产出 = min(模型能力, 认知)</text>

  <!-- 赤字区标签 -->
  <rect x="116" y="190" width="184" height="48" rx="4" fill="#FFFFFF" fill-opacity="0.92" stroke="#E0C9A6" stroke-width="1"/>
  <text x="208" y="212" font-size="12" font-weight="700" fill="#B4552D" text-anchor="middle">认知赤字区</text>
  <text x="208" y="230" font-size="11" fill="#8A6A4A" text-anchor="middle">边界 · 并发 · 资源 · 安全</text>

  <line x1="10" y1="326" x2="670" y2="326" stroke="#E4E0D8" stroke-width="1"/>
  <text x="28" y="344" font-size="11" fill="#8A8578">注：模型有多强不决定产出，使用者的认知决定产出天花板。</text>
  <rect x="452" y="330" width="218" height="26" fill="#FAF7F2" stroke="#D8D3C8" stroke-width="1"/>
  <text x="561" y="347" font-size="11" fill="#8A8578" text-anchor="middle">V-02 · 曲线图解（示意） · 2026-10</text>
</svg>
