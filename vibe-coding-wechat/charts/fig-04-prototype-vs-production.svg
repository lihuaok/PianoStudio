  <rect x="0" y="0" width="680" height="360" fill="#FFFFFF"/>
  <rect x="10" y="10" width="660" height="340" fill="#FFFDF9" stroke="#D8D3C8" stroke-width="1"/>

  <text x="28" y="36" font-size="15" font-weight="700" fill="#1B3A5C">图 V-04　原型与生产系统的层序对比</text>
  <text x="652" y="36" font-size="12" fill="#8A8578" text-anchor="end">层序图解 · 自上而下逐层加固</text>
  <line x1="10" y1="52" x2="670" y2="52" stroke="#D8D3C8" stroke-width="1"/>

  <line x1="40" y1="96" x2="300" y2="96" stroke="#B8CCDD" stroke-width="1.4"/>
