  <line x1="330" y1="130" x2="330" y2="300" stroke="#B4552D" stroke-width="2" marker-start="url(#fig04-arO)" marker-end="url(#fig04-arO)"/>
  <text x="330" y="220" font-size="11" font-weight="700" fill="#B4552D" transform="rotate(-90 330 220)" text-anchor="middle">工程密度 ↑</text>

  <text x="28" y="340" font-size="11" fill="#8A8578">左：3 层即可运行；右：6 层才敢上线。</text>
